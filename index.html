<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrenamiento Edu</title>
<style>:root{--bg:#f4f5f7;--card:#fff;--text:#17202a;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--accent2:#eff6ff;--danger:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1100px;margin:auto;padding:22px 16px 32px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}h1{margin:0;font-size:28px}.sub{color:var(--muted);margin-top:4px}.pill{background:var(--accent2);color:var(--accent);padding:7px 11px;border-radius:999px;font-size:13px;font-weight:600}.grid{display:grid;grid-template-columns:1fr 1.25fr;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 2px 8px #00000008}h2{font-size:17px;margin:0 0 12px}.sessions{display:grid;gap:8px}.session{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;cursor:pointer}.session:hover,.session.active{border-color:#93c5fd;background:var(--accent2)}.session strong{display:block;font-size:15px}.session span{font-size:12px;color:var(--muted)}.timer{text-align:center}.phase{font-size:14px;color:var(--muted);min-height:21px}.time{font-variant-numeric:tabular-nums;font-size:72px;font-weight:700;line-height:1;margin:14px 0 8px}.round{font-size:14px;color:var(--muted);margin-bottom:14px}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 17px;font-weight:650;cursor:pointer;background:#e5e7eb}.btn.primary{background:var(--accent);color:#fff}.btn.danger{background:#fee2e2;color:var(--danger)}.settings{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);text-align:left}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.field input,.field select{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:14px}.details{margin-top:16px;text-align:left;border-top:1px solid var(--line);padding-top:14px}.details ul{margin:8px 0 0;padding-left:20px;color:#4b5563}.footer{margin-top:14px;color:var(--muted);font-size:12px;text-align:center}@media(max-width:760px){.top{display:block}.pill{display:inline-block;margin-top:10px}.grid{grid-template-columns:1fr}.time{font-size:62px}.settings-grid{grid-template-columns:1fr 1fr}}</style></head>
<body><div class="wrap"><header class="top"><div><h1>🧗‍♂️ Entrenamiento Edu</h1><div class="sub">Escalada · carrera · fuerza · dedos</div></div><div class="pill">Sesiones cortas + rocódromo</div></header><div class="grid"><section class="card"><h2>🏋️ Sesiones</h2><div class="sessions" id="sessions"></div></section><section class="card timer"><div class="phase" id="phase">Selecciona una sesión</div><div class="time" id="time">00:00</div><div class="round" id="round">—</div><div class="controls"><button class="btn primary" id="start">Empezar</button><button class="btn" id="pause">Pausa</button><button class="btn danger" id="reset">Reiniciar</button></div><div class="settings" id="settings"></div><div class="details"><h2 id="detailTitle">Detalles</h2><ul id="details"></ul></div></section></div><div class="footer">Entrenamiento Edu · cronómetro con avisos sonoros</div></div>
<script>
const sessions=[
{id:"density",name:"🧗 Densidad · Rocódromo A",meta:"3 × 8 min / 4 min descanso",phases:[["Muro de densidad",480],["Descanso",240]],rounds:3,details:["3 × 8 min de muro de densidad","4 min de descanso","Intensidad aproximada: 5c–6a","Buscar economía de movimiento"]},
{id:"power",name:"🧗 Resistencia de potencia · Rocódromo B",meta:"4 × 2 min / 2 min descanso",phases:[["Trabajo",120],["Descanso",120]],rounds:4,details:["4 × (2 min trabajo + 2 min descanso)","Intensidad aproximada: 6b+/6c","No llegar al fallo absoluto"]},
{id:"hang",name:"🖐️ Suspensiones",meta:"configurable",phases:[["Trabajo",7],["Descanso",53]],rounds:6,details:["Sesión progresiva configurable","RPE objetivo inicial: 7/10","Preferencia: tabla de suspensiones; barra solo como alternativa"]},
{id:"pull",name:"💪 Dominada lastrada",meta:"6 min · fuerza",phases:[["Dominadas lastradas",3],["Descanso",45],["Escapulares",2],["Descanso",30]],rounds:4,details:["4 rondas","3 dominadas lastradas","2–3 dominadas escapulares","Dejar 2–3 repeticiones en reserva"]},
{id:"one",name:"🦾 One-arm + hombro",meta:"6 min · progresión",phases:[["Bloqueo asistido",10],["Descanso",30],["Dominada asistida",20],["Descanso",30]],rounds:3,details:["3 rondas","8–10 s de bloqueo asistido por lado","3–5 dominadas asistidas por lado","Control y calidad, no fallo"]},
{id:"legs",name:"🦵 Piernas + core",meta:"6 min · 40 s / 20 s",phases:[["Goblet squat",40],["Transición",20],["Zancadas alternas",40],["Transición",20],["Peso muerto rumano",40],["Transición",20],["Gemelos",40],["Transición",20],["Hollow / dead bug",40],["Transición",20],["Elevaciones de rodillas",40],["Transición",20]],rounds:1,details:["6 ejercicios","40 s trabajo + 20 s transición","Goblet squat · zancadas · RDL","Gemelos · hollow/dead bug · rodillas colgado"]},
{id:"mu",name:"💥 Muscle-up",meta:"8 min · potencia",phases:[["Dominadas explosivas",30],["Descanso",90],["Fondos",30],["Descanso",60],["Transiciones con banda",30],["Descanso",60]],rounds:3,details:["Dominadas explosivas: 4 × 3","Fondos: 3 × 5–8","Transiciones con banda: 3 × 3","Descansos amplios y ejecución explosiva"]}];
let selected=null,idx=0,remaining=0,round=1,timer=null,running=false;const $=id=>document.getElementById(id);
function render(){$("sessions").innerHTML=sessions.map((s,i)=>"<button class=\"session "+(selected===i?"active":"")+" \" onclick=\"selectSession("+i+")\"><strong>"+s.name+"</strong><span>"+s.meta+"</span></button>").join("")}
function selectSession(i){stop();selected=i;idx=0;round=1;remaining=sessions[i].phases[0][1];render();renderSettings();update()}
function renderSettings(){if(selected===null){$("settings").innerHTML="";return}const s=sessions[selected];if(s.id!=="hang"){$("settings").innerHTML="";return}$("settings").innerHTML='<h2>⚙️ Ajustar suspensiones</h2><div class="settings-grid"><div class="field"><label>Tiempo de suspensión (s)</label><input id="hangWork" type="number" min="3" max="30" value="7"></div><div class="field"><label>Descanso (s)</label><input id="hangRest" type="number" min="10" max="180" value="53"></div><div class="field"><label>Número de suspensiones</label><input id="hangRounds" type="number" min="1" max="20" value="6"></div><div class="field"><label>Modo</label><select id="hangMode"><option>Tabla de suspensiones</option><option>Barra</option></select></div></div><button class="btn" style="margin-top:10px;width:100%" onclick="applyHang()">Aplicar cambios</button>'}
function applyHang(){const w=Math.max(3,parseInt($("hangWork").value)||7),r=Math.max(10,parseInt($("hangRest").value)||53),n=Math.max(1,parseInt($("hangRounds").value)||6),mode=$("hangMode").value;const s=sessions[selected];s.phases=[["Suspensión",w],["Descanso",r]];s.rounds=n;s.details=[n+" × ("+w+" s suspensión + "+r+" s descanso)",mode==="Barra"?"Barra: agarre general; no sustituye a la tabla para fuerza específica":"Tabla: opción preferente para fuerza específica de dedos","RPE objetivo: 7/10","Ajusta carga/asistencia para terminar con margen, sin fallo"];idx=0;round=1;remaining=w;stop();update();render()}
function update(){if(selected===null){$("phase").textContent="Selecciona una sesión";$("time").textContent="00:00";$("round").textContent="—";$("details").innerHTML="";return}const s=sessions[selected],p=s.phases[idx];$("phase").textContent=p[0];$("time").textContent=format(remaining);$("round").textContent=s.rounds>1?"Ronda "+round+" / "+s.rounds:"Sesión única";$("detailTitle").textContent=s.name;$("details").innerHTML=s.details.map(x=>"<li>"+x+"</li>").join("")}
function format(n){return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}
let audioCtx=null;
function ensureAudio(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}catch(e){}}
function beep(freq=880,duration=.16,volume=.32){try{ensureAudio();if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type="sine";g.gain.setValueAtTime(volume,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}catch(e){}}
function start(){if(selected===null||running)return;ensureAudio();beep(700,.16,.4);running=true;timer=setInterval(tick,1000)}
function stop(){running=false;if(timer){clearInterval(timer);timer=null}}
function tick(){remaining--;if(remaining>0){if(remaining<=3)beep(560,.13,.38);update();return}beep(1050,.28,.48);nextPhase()}
function nextPhase(){const s=sessions[selected];idx++;if(idx>=s.phases.length){idx=0;round++;if(round>s.rounds){stop();remaining=0;$("phase").textContent="✅ Sesión completada";$("round").textContent="";return}}remaining=s.phases[idx][1];update()}
function reset(){stop();if(selected!==null){idx=0;round=1;remaining=sessions[selected].phases[0][1]}update()}$("start").onclick=start;$("pause").onclick=stop;$("reset").onclick=reset;render();update();
const preset=new URLSearchParams(location.search).get("s");if(preset){const n=sessions.findIndex(x=>x.id===preset);if(n>=0)selectSession(n)}
</script></body></html>
