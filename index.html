<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrenamiento Edu</title>
<style>:root{--bg:#f4f5f7;--card:#fff;--text:#17202a;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--accent2:#eff6ff;--danger:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1100px;margin:auto;padding:22px 16px 32px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}h1{margin:0;font-size:28px}.sub{color:var(--muted);margin-top:4px}.pill{background:var(--accent2);color:var(--accent);padding:7px 11px;border-radius:999px;font-size:13px;font-weight:600}.grid{display:grid;grid-template-columns:1fr 1.25fr;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 2px 8px #00000008}h2{font-size:17px;margin:0 0 12px}.sessions{display:grid;gap:8px}.session{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;cursor:pointer}.session:hover,.session.active{border-color:#93c5fd;background:var(--accent2)}.session strong{display:block;font-size:15px}.session span{font-size:12px;color:var(--muted)}.timer{text-align:center}.phase{font-size:14px;color:var(--muted);min-height:21px}.time{font-variant-numeric:tabular-nums;font-size:72px;font-weight:700;line-height:1;margin:14px 0 8px}.round{font-size:14px;color:var(--muted);margin-bottom:14px}.next{font-size:14px;color:var(--muted);min-height:20px;margin-bottom:12px}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 17px;font-weight:650;cursor:pointer;background:#e5e7eb}.btn.primary{background:var(--accent);color:#fff}.btn.danger{background:#fee2e2;color:var(--danger)}.settings{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);text-align:left}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.field input,.field select{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:14px}.details{margin-top:16px;text-align:left;border-top:1px solid var(--line);padding-top:14px}.details ul{margin:8px 0 0;padding-left:20px;color:#4b5563}.footer{margin-top:14px;color:var(--muted);font-size:12px;text-align:center}@media(max-width:760px){.top{display:block}.pill{display:inline-block;margin-top:10px}.grid{grid-template-columns:1fr}.time{font-size:62px}.settings-grid{grid-template-columns:1fr 1fr}}.focus .wrap{max-width:none;height:100vh;display:flex;align-items:center;justify-content:center}.focus .top,.focus .sessions,.focus .details,.focus .settings,.focus .footer{display:none}.focus .grid{display:block;width:min(760px,100%)}.focus .card{box-shadow:none;border:0}.focus .time{font-size:clamp(72px,18vw,150px)}.focus .next{font-size:16px}</style></head>
<body><div class="wrap"><header class="top"><div><h1>🧗‍♂️ Entrenamiento Edu</h1><div class="sub">Escalada · carrera · fuerza · dedos</div></div><div class="pill">Sesiones cortas + rocódromo</div></header><div class="grid"><section class="card"><h2>🏋️ Sesiones</h2><div class="sessions" id="sessions"></div></section><section class="card timer"><div class="phase" id="phase">Selecciona una sesión</div><div class="time" id="time">00:00</div><div class="next" id="next">Lo siguiente: —</div><div class="round" id="round">—</div><div class="controls"><button class="btn primary" id="start">Empezar</button><button class="btn" id="pause">Pausa</button><button class="btn danger" id="reset">Reiniciar</button><button class="btn" id="fullscreen">⛶ Pantalla completa</button></div><div class="settings" id="settings"></div><div class="details"><h2 id="detailTitle">Detalles</h2><ul id="details"></ul></div></section></div><div class="footer">Entrenamiento Edu · cronómetro con avisos sonoros</div></div>
<script>
const sessions=[
{id:"density",name:"🧗 Densidad · Rocódromo A",meta:"3 × 8 min / 4 min descanso",phases:[["Muro de densidad",480],["Descanso",240]],rounds:3,details:["3 × 8 min de muro de densidad","4 min de descanso","Intensidad aproximada: 5c–6a","Buscar economía de movimiento"]},
{id:"power",name:"🧗 Resistencia de potencia · Rocódromo B",meta:"4 × 2 min / 2 min descanso",phases:[["Trabajo",120],["Descanso",120]],rounds:4,details:["4 × (2 min trabajo + 2 min descanso)","Intensidad aproximada: 6b+/6c","No llegar al fallo absoluto"]},
{id:"hang",name:"🖐️ Suspensiones",meta:"progresiva y configurable",phases:[["Calentamiento · agarres superiores",20],["Descanso",20],["40 mm · activación",30],["Descanso",30],["40 mm · activación",20],["Descanso",30],["17 mm · fuerza",10],["Descanso",50],["17 mm · fuerza",10],["Descanso",50],["20 mm bidedos + goma",8],["Descanso",50],["20 mm bidedos + goma",8]],rounds:1,details:["Progresión: calentamiento → 40 mm → 17 mm → bidedos asistidos","17 mm: trabajo principal de fuerza","20 mm bidedos: usar goma suficiente para no llegar al fallo","RPE orientativo: 7–8/10"]},
{id:"pull",name:"💪 Dominada lastrada",meta:"6 min · fuerza",phases:[["Dominadas lastradas",3],["Descanso",45],["Escapulares",2],["Descanso",30]],rounds:4,details:["4 rondas","3 dominadas lastradas","2–3 dominadas escapulares","Dejar 2–3 repeticiones en reserva"]},
{id:"one",name:"🦾 One-arm + hombro",meta:"6 min · progresión",phases:[["Bloqueo asistido",10],["Descanso",30],["Dominada asistida",20],["Descanso",30]],rounds:3,details:["3 rondas","8–10 s de bloqueo asistido por lado","3–5 dominadas asistidas por lado","Control y calidad, no fallo"]},
{id:"legs",name:"🦵 Piernas + core",meta:"6 min · 40 s / 20 s",phases:[["Goblet squat",40],["Transición",20],["Zancadas alternas",40],["Transición",20],["Peso muerto rumano",40],["Transición",20],["Gemelos",40],["Transición",20],["Hollow / dead bug",40],["Transición",20],["Elevaciones de rodillas",40],["Transición",20]],rounds:1,details:["6 ejercicios","40 s trabajo + 20 s transición","Goblet squat · zancadas · RDL","Gemelos · hollow/dead bug · rodillas colgado"]},
{id:"mu",name:"💥 Muscle-up",meta:"8 min · potencia",phases:[["Dominadas explosivas",30],["Descanso",90],["Fondos",30],["Descanso",60],["Transiciones con banda",30],["Descanso",60]],rounds:3,details:["Dominadas explosivas: 4 × 3","Fondos: 3 × 5–8","Transiciones con banda: 3 × 3","Descansos amplios y ejecución explosiva"]},
{id:"floor",name:"🏠 Flexiones + core + hombros",meta:"8 min · 40 s / 20 s",phases:[["Flexiones",40],["Transición",20],["Pike push-ups · hombros",40],["Transición",20],["Dead bug",40],["Transición",20],["Flexiones cerradas",40],["Transición",20],["Pike push-ups · hombros",40],["Transición",20],["Plancha lateral · 20 s/lado",40],["Transición",20],["Puente de glúteos",40],["Transición",20],["Hollow / tuck hold",40],["Transición",20]],rounds:1,details:["8 bloques · 40 s trabajo + 20 s cambio","Pike push-ups: énfasis en hombros","Flexiones normales y cerradas · dead bug","Plancha lateral · puente de glúteos · hollow/tuck","RPE 6–8/10 · no llegar al fallo"]}]

let selected=null,idx=0,remaining=0,round=1,timer=null,running=false;
const $=id=>document.getElementById(id);

function render(){$("sessions").innerHTML=sessions.map((s,i)=>"<button class=\"session "+(selected===i?"active":"")+" \" onclick=\"selectSession("+i+")\"><strong>"+s.name+"</strong><span>"+s.meta+"</span></button>").join("")}

function selectSession(i){stop();selected=i;idx=0;round=1;remaining=sessions[i].phases[0][1];render();renderSettings();update()}

function renderSettings(){
  if(selected===null){$("settings").innerHTML="";return}
  const s=sessions[selected];
  if(s.id!=="hang"){$("settings").innerHTML="";return}
  $("settings").innerHTML='<h2>⚙️ Ajustar suspensiones</h2><div class="settings-grid">'+
  '<div class="field"><label>Nivel</label><select id="hangLevel"><option value="suave">🟢 Suave</option><option value="normal" selected>🟠 Normal</option><option value="fuerte">🔴 Fuerte</option><option value="custom">⚙️ Personalizado</option></select></div>'+
  '<div class="field"><label>N.º de bloques finales</label><input id="hangSets" type="number" min="1" max="6" value="2"></div>'+
  '<div class="field"><label>Tiempo 17 mm (s)</label><input id="hang17" type="number" min="5" max="20" value="10"></div>'+
  '<div class="field"><label>Descanso 17 mm (s)</label><input id="hang17Rest" type="number" min="20" max="120" value="50"></div>'+
  '<div class="field"><label>Tiempo bidedos + goma (s)</label><input id="hang20" type="number" min="5" max="20" value="8"></div>'+
  '<div class="field"><label>Descanso bidedos (s)</label><input id="hang20Rest" type="number" min="20" max="120" value="50"></div>'+
  '</div><button class="btn" style="margin-top:10px;width:100%" onclick="applyHang()">Aplicar cambios</button>';
  $("hangLevel").onchange=updateHangPreset;
}

function updateHangPreset(){
  const level=$("hangLevel").value;
  const presets={
    suave:{w17:8,r17:55,w20:0,r20:55,sets:1},
    normal:{w17:10,r17:50,w20:8,r20:50,sets:2},
    fuerte:{w17:10,r17:45,w20:10,r20:50,sets:2}
  };
  const p=presets[level];
  if(!p)return;
  $("hang17").value=p.w17;$("hang17Rest").value=p.r17;$("hang20").value=p.w20;$("hang20Rest").value=p.r20;$("hangSets").value=p.sets;
}

function applyHang(){
  const level=$("hangLevel").value;
  const p={suave:{w17:8,r17:55,w20:0,r20:55,sets:1},normal:{w17:10,r17:50,w20:8,r20:50,sets:2},fuerte:{w17:10,r17:45,w20:10,r20:50,sets:2}}[level];
  const w17=Math.max(5,Math.min(20,parseInt($("hang17").value)||10));
  const r17=Math.max(20,Math.min(120,parseInt($("hang17Rest").value)||50));
  const w20=Math.max(5,Math.min(20,parseInt($("hang20").value)||8));
  const r20=Math.max(20,Math.min(120,parseInt($("hang20Rest").value)||50));
  const sets=Math.max(1,Math.min(6,parseInt($("hangSets").value)||2));
  const s=sessions[selected];
  const use17=level==="custom"?w17:p.w17;
  const use17Rest=level==="custom"?r17:p.r17;
  const use20=level==="custom"?w20:p.w20;
  const use20Rest=level==="custom"?r20:p.r20;
  const useSets=level==="custom"?sets:p.sets;
  const phases=[["Calentamiento · agarres superiores",20],["Descanso",20],["40 mm · activación",30],["Descanso",30],["40 mm · activación",20],["Descanso",30]];
  for(let i=0;i<useSets;i++){phases.push(["17 mm · fuerza",use17],["Descanso",use17Rest]);}
  phases.pop();
  if(use20>0){for(let i=0;i<useSets;i++){phases.push(["20 mm bidedos + goma",use20]);if(i<useSets-1)phases.push(["Descanso",use20Rest]);}}
  s.phases=phases;s.rounds=1;
  s.details=[level==="custom"?"Configuración personalizada":"Nivel "+level,s.phases.filter(x=>x[0].includes("17 mm")).length+" suspensiones en 17 mm",use20>0?useSets+" bloques de bidedos asistidos":"Sin bidedos en este nivel","Mantener 1–2 s de margen: ajustar goma/carga antes de llegar al fallo","La tabla es la opción preferente; la barra queda para agarre general"];
  idx=0;round=1;remaining=s.phases[0][1];stop();update();
}

function update(){
  if(selected===null){$("phase").textContent="Selecciona una sesión";$("time").textContent="00:00";$("next").textContent="Lo siguiente: —";$("round").textContent="—";$("details").innerHTML="";return}
  const s=sessions[selected],p=s.phases[idx],n=getNextPhase();
  $("phase").textContent=p[0];$("time").textContent=format(remaining);$("next").textContent=n?"Lo siguiente: "+n[0]+" · "+format(n[1]):"Lo siguiente: 🏁 fin de la sesión";$("round").textContent=s.rounds>1?"Ronda "+round+" / "+s.rounds:"Sesión única";$("detailTitle").textContent=s.name;$("details").innerHTML=s.details.map(x=>"<li>"+x+"</li>").join("")
}
function getNextPhase(){if(selected===null)return null;const s=sessions[selected];let ni=idx+1,nr=round;if(ni>=s.phases.length){ni=0;nr++;if(nr>s.rounds)return null}return s.phases[ni]}

function format(n){return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}
let audioCtx=null,wakeLock=null;
function ensureAudio(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}catch(e){}}
function beep(freq=880,duration=.16,volume=.32){try{ensureAudio();if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type="sine";g.gain.setValueAtTime(volume,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}catch(e){}}
async function requestWakeLock(){try{if("wakeLock" in navigator&&!wakeLock)wakeLock=await navigator.wakeLock.request("screen")}catch(e){wakeLock=null}}
async function releaseWakeLock(){try{if(wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}
function start(){if(selected===null||running)return;ensureAudio();beep(700,.16,.4);running=true;requestWakeLock();timer=setInterval(tick,1000)}
function stop(){running=false;if(timer){clearInterval(timer);timer=null}releaseWakeLock()}
function tick(){remaining--;if(remaining>0){if(remaining<=3)beep(560,.13,.38);update();return}beep(1050,.28,.48);nextPhase()}
function nextPhase(){const s=sessions[selected];idx++;if(idx>=s.phases.length){idx=0;round++;if(round>s.rounds){stop();remaining=0;$("phase").textContent="✅ Sesión completada";$("round").textContent="";return}}remaining=s.phases[idx][1];update()}
function reset(){stop();if(selected!==null){idx=0;round=1;remaining=sessions[selected].phases[0][1]}update()}
$("start").onclick=start;$("pause").onclick=stop;$("reset").onclick=reset;$("fullscreen").onclick=async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen()}else{await document.exitFullscreen()}}catch(e){document.body.classList.toggle("focus")}update()};document.addEventListener("visibilitychange",()=>{if(running&&document.visibilityState==="visible")requestWakeLock()});render();update();
const preset=new URLSearchParams(location.search).get("s");if(preset){const n=sessions.findIndex(x=>x.id===preset);if(n>=0)selectSession(n)}
</script></body></html>
